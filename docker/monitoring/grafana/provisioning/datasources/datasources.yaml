apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Optuna
    uid: optuna
    type: postgres
    url: postgres:5432
    user: $OPTUNA_DB_USER
    secureJsonData:
      password: $OPTUNA_DB_PASSWORD
    jsonData:
      database: $OPTUNA_DB_NAME
      sslmode: disable
      postgresVersion: 1600
